<link rel="canonical" href="https://baraqapp.com/">

<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0E1A;color:#F4F2FB;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;text-align:center;padding:24px}
  a{color:#F2B84E;font-weight:700;text-decoration:none}
  a:hover{text-decoration:underline}
  .row{display:flex;gap:16px;justify-content:center;margin-top:18px;font-size:1.1rem}

<script>
  // No server-side language negotiation on static hosting, so redirect
  // client-side based on the browser's language, defaulting to Arabic
  // (the primary audience). Crawlers and no-JS visitors see the links below
  // instead, plus both hreflang tags above.
  (function () {
    var lang = (navigator.language || navigator.userLanguage || "ar").toLowerCase();
    var target = lang.indexOf("ar") === 0 ? "ar/" : "en/";
    window.location.replace(target);
  })();
</script>
